x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://faturacerta:faturacerta@postgres:5432/faturacerta
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    command: celery -A config beat -l info

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faturacerta
      POSTGRES_USER: faturacerta
      POSTGRES_PASSWORD: faturacerta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faturacerta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  media:
