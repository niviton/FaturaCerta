{% extends "base.html" %}
{% block title %}Entrar · FaturaCerta{% endblock %}
{% block content %}
<div class="login">
  <h1>Entrar no FaturaCerta</h1>
  {% if form.errors %}<p class="aviso" role="alert">Usuário ou senha incorretos. Confira e tente de novo.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="campo">
      <label for="id_username">Usuário</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
    </div>
    <div class="campo">
      <label for="id_password">Senha</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="botao principal">Entrar</button>
  </form>
</div>
{% endblock %}
