<div class="campo{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}{% if field.field.widget.input_type == 'textarea' or field.name == 'observacoes' or field.name == 'credenciais_json' %} largo{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label|capfirst }}{% if field.field.required %} <span aria-hidden="true" class="secundario">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="ajuda">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul class="erro" role="alert">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
